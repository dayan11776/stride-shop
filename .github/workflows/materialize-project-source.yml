name: Materialize project source

on:
  push:
    branches: [main]
    paths:
      - 'stride-source-*.zip'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -type f -name 'stride-source-*.zip' -print -quit)"
          test -n "$archive"
          unzip -oq "$archive" -d .
          rm -f "$archive"
      - name: Commit project source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish project source"
          git push
